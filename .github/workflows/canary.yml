name: ws03-free-windows-canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws03-free-windows-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Runner provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            event = 'runner_provenance'
            os_caption = $os.Caption
            os_version = $os.Version
            os_build = $os.BuildNumber
            ps_version = $PSVersionTable.PSVersion.ToString()
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
          } | ConvertTo-Json -Compress

      - name: Install Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@cc8ea9a08b3ee3db43d5aa6bddda4a0e87d800f7 # v0.1 pinned

      - name: External Windows UI canary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $title = 'WS03 Free Runner Canary'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'ws03-uia-target.ps1'
          $shotPath = Join-Path $env:RUNNER_TEMP 'ws03-uia.png'
          $statusPath = Join-Path $env:RUNNER_TEMP 'ws03-uia-status.txt'
          @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'WS03 Free Runner Canary'
          $form.Width = 520
          $form.Height = 230
          $form.StartPosition = 'CenterScreen'

          $input = New-Object System.Windows.Forms.TextBox
          $input.Name = 'Ws03Input'
          $input.AccessibleName = 'Ws03Input'
          $input.Left = 30
          $input.Top = 30
          $input.Width = 430

          $button = New-Object System.Windows.Forms.Button
          $button.Name = 'Ws03Apply'
          $button.AccessibleName = 'Ws03Apply'
          $button.Text = 'Apply'
          $button.Left = 30
          $button.Top = 75
          $button.Width = 100

          $status = New-Object System.Windows.Forms.Label
          $status.Text = 'Event proof is written to the runner temp directory'
          $status.Left = 30
          $status.Top = 125
          $status.AutoSize = $true

          $button.Add_Click({
            $status.Text = $input.Text
            [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ws03-uia-status.txt'), $input.Text)
          })
          $form.Controls.AddRange(@($input, $button, $status))
          [System.Windows.Forms.Application]::Run($form)
          '@ | Set-Content -LiteralPath $scriptPath -Encoding utf8

          $app = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$scriptPath) -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              & winapp ui status -a $title --json *> $null
              $statusExit = $LASTEXITCODE
            } while ($statusExit -ne 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($statusExit -ne 0) {
              Write-Output ('TARGET_PID=' + $app.Id + ';EXITED=' + $app.HasExited)
              Get-Process -Id $app.Id -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId,MainWindowHandle,MainWindowTitle | Format-List
              & winapp ui list-windows --show-hidden --json 2>&1 | Write-Output
              throw 'Synthetic UI target was not discoverable by UIA.'
            }

            & winapp ui inspect -a $title --interactive --json
            if ($LASTEXITCODE -ne 0) { throw 'UIA inspect failed.' }

            & winapp ui set-value Ws03Input 'WS03_UIA_OK' -a $title --json
            if ($LASTEXITCODE -ne 0) { throw 'UIA set-value failed.' }
            & winapp ui invoke Ws03Apply -a $title --json
            if ($LASTEXITCODE -ne 0) { throw 'UIA invoke failed.' }
            $deadline = [DateTime]::UtcNow.AddSeconds(5)
            do {
              Start-Sleep -Milliseconds 100
              $stateRaw = if (Test-Path $statusPath) { Get-Content -Raw -LiteralPath $statusPath } else { '' }
            } while ($stateRaw -ne 'WS03_UIA_OK' -and [DateTime]::UtcNow -lt $deadline)
            if ($stateRaw -ne 'WS03_UIA_OK') { throw 'UIA app-event verification failed.' }

            & winapp ui screenshot -a $title --output $shotPath --json
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $shotPath)) { throw 'UI screenshot failed.' }
            $shot = Get-Item $shotPath
            $shotHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $shotPath).Hash.ToLowerInvariant()

            $physicalClick = $false
            $physicalType = $false
            $clickDetail = $null
            $typeDetail = $null

            Remove-Item -LiteralPath $statusPath -Force -ErrorAction SilentlyContinue
            & winapp ui set-value Ws03Input 'WS03_PHYSICAL_CLICK' -a $title --json *> $null
            if ($LASTEXITCODE -eq 0) {
              $clickRaw = (& winapp ui click Ws03Apply -a $title --json 2>&1 | Out-String)
              $clickExit = $LASTEXITCODE
              if ($clickExit -eq 0) {
                Start-Sleep -Milliseconds 300
                $clickStateRaw = if (Test-Path $statusPath) { Get-Content -Raw -LiteralPath $statusPath } else { '' }
                $physicalClick = ($clickStateRaw -eq 'WS03_PHYSICAL_CLICK')
              }
              if (-not $physicalClick) { $clickDetail = ($clickRaw -replace '[\r\n]+',' ').Trim() }
            }

            Remove-Item -LiteralPath $statusPath -Force -ErrorAction SilentlyContinue
            & winapp ui set-value Ws03Input '' -a $title --json *> $null
            if ($LASTEXITCODE -eq 0) {
              $typeRaw = (& winapp ui send-keys 'WS03_PHYSICAL_TYPE' --target Ws03Input -a $title --via send-input --verbatim --json 2>&1 | Out-String)
              $typeExit = $LASTEXITCODE
              if ($typeExit -eq 0) {
                & winapp ui invoke Ws03Apply -a $title --json *> $null
                if ($LASTEXITCODE -eq 0) {
                  Start-Sleep -Milliseconds 300
                  $typeStateRaw = if (Test-Path $statusPath) { Get-Content -Raw -LiteralPath $statusPath } else { '' }
                  $physicalType = ($typeStateRaw -eq 'WS03_PHYSICAL_TYPE')
                }
              }
              if (-not $physicalType) { $typeDetail = ($typeRaw -replace '[\r\n]+',' ').Trim() }
            }

            $evidence = [ordered]@{
              schema = 'ws03.free_windows_canary.v1'
              core_uia = 'PASS'
              screenshot = 'PASS'
              screenshot_bytes = $shot.Length
              screenshot_sha256 = $shotHash
              physical_click = if ($physicalClick) { 'PASS' } else { 'UNPROVEN' }
              physical_send_input = if ($physicalType) { 'PASS' } else { 'UNPROVEN' }
              physical_click_detail = if ($physicalClick) { $null } else { $clickDetail }
              physical_send_input_detail = if ($physicalType) { $null } else { $typeDetail }
              uploads = 0
              secrets_consumed = 0
              runner = 'github-hosted/windows-2025'
            }
            'WS03_EVIDENCE_JSON=' + ($evidence | ConvertTo-Json -Compress)
          }
          finally {
            if ($null -ne $app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $scriptPath,$shotPath,$statusPath -Force -ErrorAction SilentlyContinue
          }
